    { path = "f32::max", reason = "std documents that either zero may be returned for an equal pair of zeros, which differs by target and optimisation; use alice_det_math::max" },
    { path = "f32::min", reason = "std documents that either zero may be returned for an equal pair of zeros, which differs by target and optimisation; use alice_det_math::min" },
    { path = "f32::clamp", reason = "NaN passes through with its payload and inverted bounds panic; use alice_det_math::metric::clamp (canonical NaN, total)" },
    { path = "f64::max", reason = "std documents that either zero may be returned for an equal pair of zeros, which differs by target and optimisation; use alice_det_math::max64" },
    { path = "f64::min", reason = "std documents that either zero may be returned for an equal pair of zeros, which differs by target and optimisation; use alice_det_math::min64" },
    { path = "f64::clamp", reason = "NaN passes through with its payload and inverted bounds panic; the crate has no f64 clamp, write it with alice_det_math::max64 / min64" },
    # ALICE-Law G10: no output may read the wall clock or OS randomness (ALICE-DB's G10 entries;
    # this crate has no RNG dependency, so no getrandom entry)
    { path = "std::time::Instant::now", reason = "the wall clock makes results depend on timing; pass time in or use a step count" },
    { path = "std::time::Instant::elapsed", reason = "reads the wall clock the same as Instant::now; duration_since on an already-held value is fine, this reads the clock again" },
    { path = "std::time::SystemTime::elapsed", reason = "reads the wall clock the same as SystemTime::now; duration_since on an already-held value is fine, this reads the clock again" },
    { path = "std::time::SystemTime::now", reason = "the wall clock makes results depend on timing; pass time in or use a step count" },
    { path = "std::collections::hash_map::RandomState::new", reason = "seeds from OS randomness and would make HashMap iteration order non-deterministic" },
    # ALICE-Law G13: no output may combine work in an order set by threads (scripts/order_guard.py
    # also reads rayon / crossbeam uses and normal dependencies)
    { path = "std::thread::spawn", reason = "spawning or scoping threads makes the combination order depend on scheduling and thread count (ALICE-Law G13)" },
    { path = "std::thread::scope", reason = "spawning or scoping threads makes the combination order depend on scheduling and thread count (ALICE-Law G13)" },
    { path = "std::thread::Builder::spawn", reason = "spawning or scoping threads makes the combination order depend on scheduling and thread count (ALICE-Law G13)" },
    { path = "std::thread::Builder::spawn_scoped", reason = "spawning or scoping threads makes the combination order depend on scheduling and thread count (ALICE-Law G13)" },
    { path = "std::thread::available_parallelism", reason = "the combination order of work on several threads depends on scheduling and thread count (ALICE-Law G13)" },
