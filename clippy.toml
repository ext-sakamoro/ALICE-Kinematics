# clippy configuration of alice-kinematics
#
# std's f32::midpoint is chosen per target: on x86_64, aarch64, wasm32/64, riscv and
# loongarch with the d extension, and arm with vfp2 it computes ((a as f64 + b as f64) *
# 0.5) as f32 (one rounding); elsewhere (thumbv7em and other targets without 64-bit
# hardware floats) it computes (a + b) * 0.5 in f32. Where the result is subnormal the two
# round differently, so the same inputs give different bits by target. The crate writes
# (a + b) * 0.5, which is the same on every target, and allows clippy::manual_midpoint at
# those sites with this reason. f64::midpoint has one implementation for every target and
# is not listed.
#
# Law max / min gate (ALICE-Law G2): f32 / f64 max, min and clamp are banned in
# every target (tests included); the crate calls alice_det_math::{max, min} and alice_det_math::metric::clamp
# (max64 / min64 for f64), which give an equal pair of zeros a defined sign (+0 from
# max, -0 from min) and a NaN operand the other operand. There is no raw exception.
#
# Determinism gate (ALICE-Law G1): the f32 / f64 methods whose results IEEE 754
# does not require to be correctly rounded, so the platform libm may differ
# between OS, CPU and compiler. The entries are the f32 / f64 method part of
# the lists ALICE-DB and alice-zip use (52 entries, powi included, the pending
# default). The crate is no_std by default, where these do not compile; the
# std and lol builds can call them, and CI lints those builds with -D warnings.
# The crate has no libm dependency, so no libm free function can be named.
# Test helpers whose expected value must not come from the code under test
# carry a scoped #[expect] with the reason.
disallowed-methods = [
    { path = "f32::midpoint", reason = "target-dependent std implementation (f64 on x86_64 / aarch64 / wasm, f32 elsewhere): bits differ by target at subnormal results; write (a + b) * 0.5" },
    { path = "f32::sin", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::cos", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
    { path = "f32::sin_cos", reason = "platform libm is not cross-platform bit-exact; use alice_det_math" },
