# ALICE-Law G13: no output may depend on hash iteration order (a BTreeMap / BTreeSet is the
# ordered form)
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is randomised per process; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order is randomised per process; use BTreeSet" },
    { path = "std::thread::Builder", reason = "a thread whose results are combined makes the order depend on scheduling and thread count (ALICE-Law G13)" },
    { path = "std::thread::JoinHandle", reason = "a thread whose results are combined makes the order depend on scheduling and thread count (ALICE-Law G13)" },
    { path = "std::thread::ScopedJoinHandle", reason = "a thread whose results are combined makes the order depend on scheduling and thread count (ALICE-Law G13)" },
]
