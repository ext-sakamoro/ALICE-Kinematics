[package]
name = "alice-kinematics"
version = "0.3.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Human motion intent compression — 1000Hz raw coordinates → 8-byte kinematic intent"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ext-sakamoro/ALICE-Kinematics"
keywords = ["kinematics", "motion-capture", "compression", "no_std", "vr"]
categories = ["no-std", "compression", "game-development"]
# crate 本体のみを package する allowlist (配布に不要な .github / docs / scripts / tests /
# examples / rust-toolchain / CONTRIBUTING を除外) Cargo.toml / Cargo.lock は常に含まれる
include = [
    "src/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-Proprietary",
    "TRADEMARK_NOTICE",
]

[features]
default = []
std = []
# Encoder modules (jerk minimization, sensor -> intent extraction); the same
# licence as the rest of the crate (LicenseRef-Proprietary, see LICENSE-Proprietary)
encoder = []

# `lol` — Milestone B.3 (2026-08-06): ALICE-LOL DSL bridge
# LOL IntentNode 16 variant を Kinematics Intent (8-byte packet) の Vec に翻訳
# Kinematics IntentType は 4 variant (Reach/Point/Grasp/Release) のため
# 一部 verb は Unmappable error、Rest は 空 Vec (silent)、Parallel は concurrency 喪失で flatten
lol = ["dep:alice-lol", "std"]

[dependencies]
# Law helpers: max / min / clamp with a defined zero sign and NaN result (ALICE-Law G2)
alice-det-math = { version = "0.5.1", default-features = false }
# B.3 Milestone: LOL DSL bridge (optional path dep)
alice-lol = { path = "../ALICE-LOL/alice-lol", version = ">=0.4.1, <0.6", optional = true, default-features = false }

[dev-dependencies]
# SHA-256 of the recorded-bit scenarios (tests/semantics_golden.rs) and of the
# semantics identifier fold (tests/kin_semantics_id.rs)
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

# `alice_lint_probe` is set only by scripts/clippy_lint_probe.py (see the probe
# at the end of src/lib.rs)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(alice_lint_probe)"] }
