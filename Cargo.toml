[package]
name = "alice-kinematics"
version = "0.1.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Human motion intent compression — 1000Hz raw coordinates → 8-byte kinematic intent"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ext-sakamoro/ALICE-Kinematics"
keywords = ["kinematics", "motion-capture", "compression", "no_std", "vr"]
categories = ["no-std", "compression", "game-development"]

[features]
default = []
std = []
# AGPL-3.0 licensed encoder modules
# Activating this feature includes code licensed under AGPL-3.0.
# See LICENSE-AGPL for details.
encoder = []

# rerun-io/rerun 統合による debug 可視化 (dev-dep のみ、release binary に影響なし)
# 有効化して `cargo run --example autorig_rerun_viz --features rerun-viz` で
# stick figure mesh + skeleton + skinning weights を rerun viewer に log できる
rerun-viz = ["dep:rerun", "std"]

# `lol` — Milestone B.3 (2026-08-06): ALICE-LOL DSL bridge
# LOL IntentNode 16 variant を Kinematics Intent (8-byte packet) の Vec に翻訳
# Kinematics IntentType は 4 variant (Reach/Point/Grasp/Release) のため
# 一部 verb は Unmappable error、Rest は 空 Vec (silent)、Parallel は concurrency 喪失で flatten
lol = ["dep:alice-lol", "std"]

[dependencies]
# rerun MSRV は 1.95 (v0.35)、本 crate は rust-toolchain 1.92 pin なので
# 互換の古い version を採用 (v0.22 系、rustc 1.79+ 対応)
# feature `native_viewer` = 3D viewer 起動、sdk = logging API
rerun = { version = "0.22", optional = true, default-features = false, features = ["sdk", "native_viewer"] }
# B.3 Milestone: LOL DSL bridge (optional path dep)
alice-lol = { path = "../ALICE-LOL/alice-lol", optional = true, default-features = false }

[dev-dependencies]

[[example]]
name = "autorig_rerun_viz"
required-features = ["rerun-viz"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
