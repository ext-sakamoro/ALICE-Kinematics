[package]
name = "alice-lol-robot"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.90"
description = "Robot template for ALICE-LOL DSL — Phase 3 Intent verb → humanoid FK + 8-byte Kinematics packet. Wires intent.rs + alice-lol-humanoid + alice-kinematics."
license = "LicenseRef-Proprietary"
authors = ["Moroya Sakamoto"]
repository = "https://github.com/ext-sakamoro/ALICE-Kinematics"
homepage = "https://github.com/ext-sakamoro/ALICE-Kinematics"
documentation = "https://docs.rs/alice-lol-robot"
readme = "../README.md"
keywords = ["dsl", "sdf", "robot", "intent", "kinematics"]
categories = ["graphics", "game-development", "robotics"]

[dependencies]
alice-lol = { git = "https://github.com/ext-sakamoro/ALICE-LOL", rev = "41268d9097095d5765480b12b10902822a41755f", version = "0.5.0", default-features = false }
alice-lol-humanoid = { git = "https://github.com/ext-sakamoro/ALICE-LOL", rev = "41268d9097095d5765480b12b10902822a41755f", version = "0.1", default-features = false }
glam = "0.29"

# Kinematics 8-byte Intent packet bridge (default on、本 crate の主目的)
# alice-kinematics はこの repository の root の crate
alice-kinematics = { path = "..", version = ">=0.2, <0.4", default-features = false, features = ["lol", "std"], optional = true }

[features]
default = ["kinematics"]
# LOL IntentNode → Kinematics 8-byte packet 翻訳 (Path C 結線)
kinematics = ["dep:alice-kinematics"]

# feature-gated dep は cargo-machete が unused false-positive で報告するため ignore
[package.metadata.cargo-machete]
ignored = ["alice-kinematics"]

[[example]]
name = "robot_grasp"
required-features = ["kinematics"]

[[example]]
name = "robot_walk"
required-features = ["kinematics"]

[[example]]
name = "robot_dance"
required-features = ["kinematics"]
