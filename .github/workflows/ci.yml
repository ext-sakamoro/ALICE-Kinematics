name: CI

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']

# a newer commit on the same branch stops the older run; on main every commit
# gets its own group and is not stopped
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    # x86_64 (ubuntu) and aarch64 (macOS): the Law tests (ALICE-Law G4) run on both
    # architectures; scripts/run_tests.sh fails a leg whose binary ran fewer tests
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # B.3 Milestone (2026-08-06): lol feature の optional path dep 対応
      # alice-lol と alice-sdf (alice-lol の transitive dep) を sibling checkout
      - uses: actions/checkout@v5
        with:
          path: ALICE-Kinematics
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LOL
          path: ALICE-LOL
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (default, with the Law tests counted)
        working-directory: ALICE-Kinematics
        run: scripts/run_tests.sh semantics_golden=6,kin_semantics_id=11,float_edge_golden=4,law_max_min_ties=4,stream_hello=14,float_environment=2,nan_boundaries=50 -- cargo test --lib --tests
      - name: cargo test (encoder, with the encoder's NaN boundaries counted)
        working-directory: ALICE-Kinematics
        run: scripts/run_tests.sh law_max_min_ties=5,nan_boundaries=59 -- cargo test --lib --tests --features encoder
      - name: cargo test (lol bridge)
        working-directory: ALICE-Kinematics
        run: scripts/run_tests.sh nan_boundaries=51 -- cargo test --lib --tests --features lol
      - name: library has no rerun dependency (all features)
        working-directory: ALICE-Kinematics
        run: |
          tree=$(cargo tree -e normal,build --all-features)
          n=$(printf '%s\n' "$tree" | grep -c .)
          if [ "$n" -eq 0 ]; then echo "no packages checked"; exit 1; fi
          if printf '%s\n' "$tree" | grep -qiE '(^|[^a-z-])rerun([^a-z-]|$)'; then
            echo "FAIL: rerun present in library dependency tree"; exit 1
          fi
          echo "OK: no rerun in $n dependency lines (all features)"

  release:
    # ALICE-Law G5: the whole test suite under the release profile, on x86_64 (ubuntu) and
    # aarch64 (macOS, the target whose default codegen uses a hardware fma); the Law tests
    # are counted as in the test job
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Kinematics
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LOL
          path: ALICE-LOL
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --release (default, with the Law tests counted)
        working-directory: ALICE-Kinematics
        run: scripts/run_tests.sh semantics_golden=6,kin_semantics_id=11,float_edge_golden=4,law_max_min_ties=4,stream_hello=14,float_environment=2,nan_boundaries=50 -- cargo test --release --lib --tests
      - name: cargo test --release (encoder, with the encoder's NaN boundaries counted)
        working-directory: ALICE-Kinematics
        run: scripts/run_tests.sh law_max_min_ties=5,nan_boundaries=59 -- cargo test --release --lib --tests --features encoder
      - name: cargo test --release (lol bridge)
        working-directory: ALICE-Kinematics
        run: scripts/run_tests.sh nan_boundaries=51 -- cargo test --release --lib --tests --features lol

  float-environment:
    # ALICE-Law G14 on each OS: round-to-nearest-even and no flush-to-zero at run
    # time in both profiles (scripts/run_tests.sh float_environment=2 fails unless
    # both tests passed), the static build configuration guard, and on ubuntu /
    # macOS the flags cargo really passes to rustc, read from `-v` in a fresh
    # target directory (scripts/build_flags_check.py)
    name: Float environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: ALICE-Kinematics
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Kinematics
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LOL
          path: ALICE-LOL
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF
      - uses: dtolnay/rust-toolchain@stable
      - name: Float environment (debug and release)
        run: |
          scripts/run_tests.sh float_environment=2 -- cargo test --test float_environment
          scripts/run_tests.sh float_environment=2 -- cargo test --release --test float_environment
      - name: run_tests.sh and build configuration guard (tests, then check)
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/test_run_tests.py
          "$PY" scripts/test_build_config_guard.py
          "$PY" scripts/build_config_guard.py
          "$PY" scripts/test_build_flags_check.py
      - name: Effective rustc flags (default, encoder, all features)
        if: runner.os != 'Windows'
        run: |
          python3 scripts/build_flags_check.py -- cargo check --release --lib
          python3 scripts/build_flags_check.py -- cargo check --release --lib --features encoder
          python3 scripts/build_flags_check.py -- cargo check --release --lib --all-features
      # ALICE-Law G3, syntax-tree pre-check (tools/no-outer-fneg-of-fma, byte-identical to
      # ALICE-LOL's): its own tests, then the check over src/ tests/ examples/ benches/ with
      # the exact fma-call counts of scripts/no-outer-fneg-of-fma-allowlist.toml (0 here);
      # the IR half is .github/workflows/g3-ir.yml
      - name: No negated fma result (syntax tree, tests then check)
        run: |
          cargo fmt --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --check
          cargo test --quiet --locked --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml
          cargo run --quiet --locked --release --manifest-path tools/no-outer-fneg-of-fma/Cargo.toml -- --root .
          # scripts/changed_paths.py decides whether g3-ir.yml's IR job runs; its own tests
          python3 scripts/test_changed_paths.py

      # ALICE-Law G11 (c), on each OS (the Windows leg exercises the checker's line-ending
      # path): the files shared with the other crates are the bytes ALICE-Law's table records
      # (table and checker fetched at .github/shared-files-pin, both SHA-256 pinned); a
      # difference, an unlisted shared path or nothing compared fails
      - name: Shared files equal ALICE-Law's table
        run: |
          python3 scripts/test_shared_files.py
          scripts/shared_files.sh

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Kinematics
          # the release tags: scripts/id_move_check.py compares with the newest one
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LOL
          path: ALICE-LOL
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy (encoder)
        working-directory: ALICE-Kinematics
        run: cargo clippy --lib --tests --features encoder -- -W clippy::all -W clippy::pedantic
      # the G1 list in clippy.toml can only fire where f32 / f64 methods exist:
      # the default build is no_std, so std and lol (which enables std) are
      # linted too. RUSTFLAGS=-Dwarnings makes every lint an error
      - name: clippy (std, all targets)
        working-directory: ALICE-Kinematics
        run: cargo clippy --all-targets --features std -- -W clippy::all -W clippy::pedantic
      # Not pedantic: src/lol_bridge.rs trips pedantic lints that are not part
      # of this gate; the disallowed lists of clippy.toml are on by default
      - name: clippy (all features, all targets)
        working-directory: ALICE-Kinematics
        run: cargo clippy --all-targets --all-features
      # the two steps above must reach the std build: rerun each with
      # --cfg alice_lint_probe (one f32::sin at the end of src/lib.rs) and fail
      # unless clippy reports it there (0 reports = the step lints nothing
      # where the G1 list can fire)
      - name: clippy lint probe (checker tests)
        working-directory: ALICE-Kinematics
        run: python3 scripts/test_clippy_lint_probe.py
      - name: clippy lint probe (std and all-features steps reach the std build)
        working-directory: ALICE-Kinematics
        run: |
          python3 scripts/clippy_lint_probe.py -- cargo clippy --all-targets --features std -- -W clippy::all -W clippy::pedantic
          python3 scripts/clippy_lint_probe.py -- cargo clippy --all-targets --all-features
      # the lists in clippy.toml only gate anything if clippy flags a call to
      # them: a throwaway crate with the same clippy.toml plants one banned call
      # per row of scripts/clippy_canary_calls.tsv (0 rows fail). The rows are
      # generated from clippy.toml, one per disallowed-methods / disallowed-types
      # entry; --check fails when the file has drifted from clippy.toml
      - name: Clippy canary data (generator tests)
        working-directory: ALICE-Kinematics
        run: python3 scripts/test_gen_clippy_canary_calls.py
      - name: Clippy canary data (generated from clippy.toml, no drift)
        working-directory: ALICE-Kinematics
        run: python3 scripts/gen_clippy_canary_calls.py --check
      - name: Clippy canary (tests)
        working-directory: ALICE-Kinematics
        run: python3 scripts/test_clippy_canary.py
      - name: Clippy canary (every planted banned call is flagged)
        working-directory: ALICE-Kinematics
        run: python3 scripts/clippy_canary.py
      # ALICE-Law G2: every public output returning an f32 value has a NaN test in
      # tests/nan_boundaries.rs (the struct-returning ones not yet canonical are its counted DEBT)
      - name: NaN boundaries (scanner tests, then the scan)
        working-directory: ALICE-Kinematics
        run: |
          python3 scripts/test_nan_boundary_scan.py
          python3 scripts/nan_boundary_scan.py
      # ALICE-Law G13 / G10, the source-reading half next to clippy.toml: order_guard reports
      # every unspecified-order collection, thread / rayon / crossbeam use and ordering normal
      # dependency in src/ (scripts/order_allowlist.toml, empty: none is allowed);
      # entropy_guard every OS randomness / wall clock read (its ALLOWED is empty)
      - name: Order and entropy guards (tests, then the scans)
        working-directory: ALICE-Kinematics
        run: |
          python3 scripts/test_entropy_guard.py
          python3 scripts/test_order_guard.py
          python3 scripts/entropy_guard.py
          python3 scripts/order_guard.py
      # G9: an identifier (KIN_SEMANTICS_ID, KIN_WIRE_SEMANTICS_ID) moves only with a breaking version, with the
      # released value in its previous list (when it has one) and both values named in
      # CHANGELOG.md; the released value is read from the published crate at the newest
      # release tag (scripts/id_move_check.py, shared with the other ALICE crates). A
      # registry that cannot be read fails on main and warns on ci/ branches and PRs
      - name: Identifier moves (tests)
        working-directory: ALICE-Kinematics
        run: python3 scripts/test_id_move_check.py
      - name: Identifier moves (the release compared with)
        working-directory: ALICE-Kinematics
        id: id-base
        run: echo "crate=$(python3 scripts/id_move_check.py --print-base)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/registry/cache/*/${{ steps.id-base.outputs.crate }}.crate
          key: id-move-${{ steps.id-base.outputs.crate }}
      - name: Identifier moves (against the published release)
        working-directory: ALICE-Kinematics
        run: python3 scripts/id_move_check.py

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Kinematics
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LOL
          path: ALICE-LOL
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo doc
        working-directory: ALICE-Kinematics
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
