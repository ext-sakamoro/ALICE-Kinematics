name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # B.3 Milestone (2026-08-06): lol feature の optional path dep 対応
      # alice-lol と alice-sdf (alice-lol の transitive dep) を sibling checkout
      - uses: actions/checkout@v5
        with:
          path: ALICE-Kinematics
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LOL
          path: ALICE-LOL
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (default)
        working-directory: ALICE-Kinematics
        run: cargo test --lib --tests
      - name: cargo test (encoder)
        working-directory: ALICE-Kinematics
        run: cargo test --lib --tests --features encoder
      - name: cargo test (lol bridge)
        working-directory: ALICE-Kinematics
        run: cargo test --lib --tests --features lol
      - name: library has no rerun dependency (all features)
        working-directory: ALICE-Kinematics
        run: |
          tree=$(cargo tree -e normal,build --all-features)
          n=$(printf '%s\n' "$tree" | grep -c .)
          if [ "$n" -eq 0 ]; then echo "no packages checked"; exit 1; fi
          if printf '%s\n' "$tree" | grep -qiE '(^|[^a-z-])rerun([^a-z-]|$)'; then
            echo "FAIL: rerun present in library dependency tree"; exit 1
          fi
          echo "OK: no rerun in $n dependency lines (all features)"

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Kinematics
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LOL
          path: ALICE-LOL
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy (encoder)
        working-directory: ALICE-Kinematics
        run: cargo clippy --lib --tests --features encoder -- -W clippy::all -W clippy::pedantic
      # the lists in clippy.toml only gate anything if clippy flags a call to
      # them: a throwaway crate with the same clippy.toml plants one banned call
      # per row of scripts/clippy_canary_calls.tsv (0 rows fail). The rows are
      # generated from clippy.toml, one per disallowed-methods / disallowed-types
      # entry; --check fails when the file has drifted from clippy.toml
      - name: Clippy canary data (generator tests)
        working-directory: ALICE-Kinematics
        run: python3 scripts/test_gen_clippy_canary_calls.py
      - name: Clippy canary data (generated from clippy.toml, no drift)
        working-directory: ALICE-Kinematics
        run: python3 scripts/gen_clippy_canary_calls.py --check
      - name: Clippy canary (tests)
        working-directory: ALICE-Kinematics
        run: python3 scripts/test_clippy_canary.py
      - name: Clippy canary (every planted banned call is flagged)
        working-directory: ALICE-Kinematics
        run: python3 scripts/clippy_canary.py

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Kinematics
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-LOL
          path: ALICE-LOL
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Zip
          path: ALICE-Zip
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-SDF
          path: ALICE-SDF
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo doc
        working-directory: ALICE-Kinematics
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
