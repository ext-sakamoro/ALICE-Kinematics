[G6]
status = "fail-known"
note = "Premise: this manifest treats the crate as Law-bearing, pending the owner's scope decision, so G6 to G8 are judged on that basis. The crate exports no semantics identifier: src/lib.rs has no SEMANTICS_ID (or equivalent) and the crate has no dependency on alice-det-math or any other Law-bearing crate whose identifier it could fold (Cargo.toml [dependencies] holds only the optional alice-lol bridge). There is accordingly no hex test and no pin-change test. Whether the crate stays Law-bearing, and with it the use of its own approximations in place of alice-det-math (see G1), is the owner's scope decision."

[G7]
status = "unverified"
note = "audit: the type-erasing boundaries are src/intent.rs:137 Intent::encode / :155 Intent::decode (8-byte packet) and :224 / :244 ExtendedIntent::encode / decode (16 bytes); the crate has no extern \"C\" or no_mangle item, no pyo3 or wasm-bindgen export, no dyn Any or name-keyed registry, and no build.rs or procedural macro (grep over src and Cargo.toml; no build.rs in the tree). None of these boundaries receives another crate's Law-bearing value: decode reads this crate's own packet format, and the one cross-crate value the crate takes, alice_lol IntentNode in src/lol_bridge.rs (lol feature), is passed as a concrete Rust type, which needs no per-value identifier. Not claimed as pass or n/a: pass needs a named mutant over a committed mismatch test, and n/a needs a scanner that finds zero such sites with the mutant of adding one; neither exists here."

[G8]
status = "fail-known"
note = "the Intent packet is written by src/intent.rs:137 Intent::encode (8 bytes: three Q8.8 positions, 1 byte duration, 1 byte flags) and :224 ExtendedIntent::encode (16 bytes), and read back by :155 Intent::decode and :244 ExtendedIntent::decode, with no identifier field in either format and no check of one in either reader: all 8 bytes of the base packet are used (src/intent.rs:98-103 layout), so an identifier is a format change. Under the premise stated in G6 this is the located absence of the persisted identifier, the round-trip test that reads a value written with another identifier, and the mismatch error. Whether the packet is read back by another release (this gate) or only within one exchange (G7) does not change that the packet carries no identifier."

