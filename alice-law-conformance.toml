note = "raw f32 / f64 max, min and clamp are a default-deny in clippy.toml, with no exception and so no raw_* manifest. The helpers come from alice-det-math, the owner of these Laws, rather than a local copy: max / min give an equal pair of zeros a defined sign (+0 from max, -0 from min, where std documents that either may be returned) and a NaN operand the other operand; clamp gives the canonical NaN for a NaN argument and lets the low bound win for inverted bounds (std passes a NaN through with its payload and panics on inverted bounds). On the inputs the sites see (finite values, constant bounds) the results are the bits std gave; the tests that pin the packet encodings pass unchanged. The default build is no_std; the helpers are core-only, so every build uses them. The crate builds no SIMD path (grep for target_feature, core::arch, std::arch and simd over src and Cargo.toml: 0), so the per-width test list is empty. f32::clamp and the f64 forms are not named by the gate; they are banned for the same reason. The scalar zero-sign and NaN behaviour of the helpers is alice-det-math's and is tested there. A comparison written out by hand is not a call the ban sees, so tests/law_max_min_ties.rs compares bits at the public API at the tie inputs (-0, a NaN with a payload) for each site class where such an input reaches the site: grip (src/hand.rs line 238: -0 stays -0, NaN becomes the canonical NaN), the inverse kinematics cosine clamp (src/joint.rs line 437: a NaN target gives the canonical NaN in every angle), the jerk fit progress min (src/jerk.rs line 207, encoder: a NaN timestamp still gives progress 1); measured 2026-10-17, each reverted, red for: grip as `if a < 0 {0} else if a > 1 {1} else {a}`, as `if a > 0 {..} else {0}`, as std clamp, as std max then min; the cosine clamp as comparisons and as std clamp; the progress min as `if a > 1 {1} else {a}`. Sites no tie input reaches from the public API: src/autorig/skinning.rs line 88 (the squared distance drops the sign of zero and the point's NaN reaches the result first; two comparison rewrites leave the test green, which pins that), src/jerk.rs line 186 and 206 (max against 1e-12 / 1e-6 of a value that is finite and non-negative there, so neither a zero tie nor a NaN occurs) and line 286 (the s_profile clamp: a -0 only feeds a comparison and a max against 1e-6), src/lol_bridge.rs lines 276 and 286 (the result is cast to u8, where NaN and both zeros give the same byte for every form). NaN operands: each tie test's NaN case compares the result with the canonical NaN 0x7fc0_0000 (Law text, G2) in debug and release on both architectures; the release build had set the sign bit of the IK's NaN angles (src/joint.rs line 462, `sign * angle` lowered to a select of fneg), fixed by canonicalising at the outputs (src/nan.rs). The struct-returning outputs that are still raw are G4's located debt, not G2's."
