note = "no Law helper for max/min and no default-deny manifest of raw_* exceptions exist, and no clippy ban on f32::max / f32::min. The library calls f32 max/min directly at src/jerk.rs:182 (`.max(1e-12)`) and :198 (`.min(1.0)` then `.max(1e-6)`; both in the encoder-gated jerk module), and f32::clamp (whose NaN and signed-zero handling is also platform-visible, not named by the gate) at src/jerk.rs:272, src/hand.rs:238, src/joint.rs:436, src/autorig/skinning.rs:88, src/lol_bridge.rs:276 and :286; the other min calls in src (src/autorig/hypothesis.rs:319-323, src/autorig/slice.rs:179, src/joint.rs:217) are usize. A probe function calling x.max(0.5) and x.min(2.0) added under the std feature passed the CI clippy command (rc 0, measured 2026-10-15, reverted). The crate builds no SIMD path (grep for target_feature, core::arch, std::arch, simd over src and Cargo.toml: 0), so the per-width test list is empty."
reference_repo = "ALICE-Analytics"

