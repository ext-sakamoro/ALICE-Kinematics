# ALICE-Law conformance manifest for this crate (alice-kinematics). One entry per
# gate defined in ALICE-Law's conformance/gates.toml; the schema (status /
# evidence / mutant / since / note / reference_repo) is the "Manifest" section
# of docs/CONFORMANCE.md in that repository.
#
# Every entry is written from what this repository's tree at the commit below
# shows, checked directly (cargo test on the default, encoder and lol feature
# sets; the CI clippy command; a grep over src, tests, examples and the
# workflows). No cell is `pass`: a `pass` needs a named mutant that turns
# committed evidence red, and this repository has no Law gate yet, so there is
# no such evidence to turn red. `fail-known` says where the requirement is
# unmet. `unverified` says why the cell could not be decided.
#
# Checked at: 1cc1b09 (origin/main, 2026-10-15).

[G1]
status = "fail-known"
note = "the requirement is absent: there is no clippy.toml / .clippy.toml (no disallowed-methods list for f32 and f64), and the only clippy step, .github/workflows/ci.yml:78 `cargo clippy --lib --tests --features encoder -- -W clippy::all -W clippy::pedantic`, neither bans a method nor builds the std and lol feature sets, and there is no canary. Today's tree has no call of a banned method in src (grep for the 25 banned names over src: 0), because the crate is #![no_std] (src/lib.rs:39), where f32::sin and the like do not compile; that is a property of the default and encoder builds, not a gate: with `--features std` (and lol, which enables std, Cargo.toml) a probe function calling sin, cos, powf, exp, ln and sin_cos added to src/lib.rs compiled and passed the CI clippy command unchanged (rc 0, measured 2026-10-15, reverted). powi is called once, in test code (src/encoder.rs:230, inside #[cfg(test)]), and is not banned. The library's own transcendental approximations (src/joint.rs sin_approx / acos_approx / fast_sqrt, src/jerk.rs log2_approx / fast_sqrt_jerk, src/autorig/hypothesis.rs cos_approx / sin_approx) are polynomial and bit-trick code, not alice-det-math; the crate has no dependency on alice-det-math (Cargo.toml). Whether those approximations are acceptable in place of alice-det-math is a decision about the crate's role as a Law-bearing crate, not answered by the tree."
reference_repo = "ALICE-Analytics"

[G2]
status = "fail-known"
note = "no Law helper for max/min and no default-deny manifest of raw_* exceptions exist, and no clippy ban on f32::max / f32::min. The library calls f32 max/min directly at src/jerk.rs:182 (`.max(1e-12)`) and :198 (`.min(1.0)` then `.max(1e-6)`; both in the encoder-gated jerk module), and f32::clamp (whose NaN and signed-zero handling is also platform-visible, not named by the gate) at src/jerk.rs:272, src/hand.rs:238, src/joint.rs:436, src/autorig/skinning.rs:88, src/lol_bridge.rs:276 and :286; the other min calls in src (src/autorig/hypothesis.rs:319-323, src/autorig/slice.rs:179, src/joint.rs:217) are usize. A probe function calling x.max(0.5) and x.min(2.0) added under the std feature passed the CI clippy command (rc 0, measured 2026-10-15, reverted). The crate builds no SIMD path (grep for target_feature, core::arch, std::arch, simd over src and Cargo.toml: 0), so the per-width test list is empty."
reference_repo = "ALICE-Analytics"

[G3]
status = "fail-known"
note = "no checker for an outer negation of an fma result exists (no script in scripts/, no ci.yml step). The library, tests and examples contain no mul_add at all (grep over src, tests, examples: 0), so today's tree has no such site; that is an audit, not a gate: a probe `-(x.mul_add(2.0, 1.0))` added under the std feature passed the CI clippy command (rc 0, measured 2026-10-15, reverted), so a later outer negation would not turn anything red. Not n/a: that status needs a scanner that finds zero sites and the mutant of adding one, and there is no scanner."
reference_repo = "ALICE-LOL"

