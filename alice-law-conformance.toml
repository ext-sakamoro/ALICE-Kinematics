[G6]
status = "fail-known"
note = "the crate exports no semantics identifier: src/lib.rs has no SEMANTICS_ID (or equivalent) and the crate has no dependency on alice-det-math or any other Law-bearing crate whose identifier it could fold (Cargo.toml [dependencies] holds only the optional alice-lol bridge). There is accordingly no hex test and no pin-change test. Whether this crate is meant to carry a Law identifier of its own (its f32 arithmetic is its own approximations, see G1) is a design decision for the owner."

[G7]
status = "unverified"
note = "audit: the type-erasing boundaries are src/intent.rs:137 Intent::encode / :155 Intent::decode (8-byte packet) and :224 / :244 ExtendedIntent::encode / decode (16 bytes); the crate has no extern \"C\" or no_mangle item, no pyo3 or wasm-bindgen export, no dyn Any or name-keyed registry, and no build.rs or procedural macro (grep over src and Cargo.toml; no build.rs in the tree). The one cross-crate value it takes, alice_lol IntentNode in src/lol_bridge.rs (lol feature), is passed as a concrete Rust type. Whether the Intent packet carries another Law-bearing crate's values (so that a producer identifier must travel with it) cannot be answered while the crate has no identifier (G6). Not claimed as n/a: that status needs a scanner finding zero sites with the mutant of adding one, and there is none."

[G8]
status = "unverified"
note = "undecided: the crate's wire format is the packed Intent (src/intent.rs:137 encode, :155 decode; Q8.8 positions, 1 byte duration, 1 byte flags, no identifier field, and src/intent.rs:224 / :244 for the 16-byte extended form), written so that a receiver reconstructs a trajectory. Whether that packet is a durable form read back later by another release (G8) or an in-exchange stream (G7), and whether its values are Law-bearing, is a decision about the crate's intent that the tree does not answer; the packet has no room for an identifier (all 8 bytes are used), so a G8 identifier would be a format change."

