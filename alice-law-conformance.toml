# ALICE-Law conformance manifest for this crate (alice-kinematics). One entry per
# gate defined in ALICE-Law's conformance/gates.toml; the schema (status /
# evidence / mutant / since / note / reference_repo) is the "Manifest" section
# of docs/CONFORMANCE.md in that repository.
#
# Every entry is written from what this repository's tree at the commit below
# shows, checked directly (cargo test on the default, encoder and lol feature
# sets; the CI clippy command; a grep over src, tests, examples and the
# workflows). No cell is `pass`: a `pass` needs a named mutant that turns
# committed evidence red, and this repository has no Law gate yet, so there is
# no such evidence to turn red. `fail-known` says where the requirement is
# unmet. `unverified` says why the cell could not be decided.
#
# The crate is treated as Law-bearing pending the owner's scope decision (see G6).
#
# Checked at: 1cc1b09 (origin/main, 2026-10-15).

[G1]
status = "fail-known"
note = "the requirement is absent: there is no clippy.toml / .clippy.toml (no disallowed-methods list for f32 and f64), and the only clippy step, .github/workflows/ci.yml:78 `cargo clippy --lib --tests --features encoder -- -W clippy::all -W clippy::pedantic`, neither bans a method nor builds the std and lol feature sets, and there is no canary. Today's tree has no call of a banned method in src (grep for the 25 banned names over src: 0), because the crate is #![no_std] (src/lib.rs:39), where f32::sin and the like do not compile; that is a property of the default and encoder builds, not a gate: with `--features std` (and lol, which enables std, Cargo.toml) a probe function calling sin, cos, powf, exp, ln and sin_cos added to src/lib.rs compiled and passed the CI clippy command unchanged (rc 0, measured 2026-10-15, reverted). powi (pending, banned by default) is called once, in test code only (src/encoder.rs:230, inside #[cfg(test)]), is pending in Law's gates.toml (banned by default, a crate allowing it states a reason) and is not stated here. The library's own transcendental approximations (src/joint.rs sin_approx / acos_approx / fast_sqrt, src/jerk.rs log2_approx / fast_sqrt_jerk; the sin/cos helpers in src/autorig/hypothesis.rs:565,569 are inside #[cfg(test)] from :465 and are test helpers) are polynomial and bit-trick code, not alice-det-math; the crate has no dependency on alice-det-math (Cargo.toml). Whether those approximations are acceptable in place of alice-det-math is a decision about the crate's role as a Law-bearing crate, not answered by the tree."
reference_repo = "ALICE-Analytics"

[G2]
